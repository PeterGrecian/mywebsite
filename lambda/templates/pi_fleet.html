<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Fleet Status</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+CiAgPCEtLSBCbHVlIFBldGVyIG5hdXRpY2FsIGZsYWcgLS0+CiAgPHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiBmaWxsPSIjMDAzODkzIiByeD0iMyIvPgogIDxyZWN0IHg9IjkiIHk9IjkiIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgZmlsbD0iI0ZGRkZGRiIvPgo8L3N2Zz4K">
<style>
    * {{ box-sizing: border-box; }}
    body {{ font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; margin: 0; padding: 0.6rem 0.75rem; }}
    .container {{ max-width: 1200px; margin: 0 auto; }}
    .top-bar {{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; gap: 0.5rem; }}
    .home-link a {{ color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 500; }}
    .home-link a:hover {{ opacity: 0.8; }}
    h1 {{ color: var(--text); font-size: 1.15rem; margin: 0; font-weight: 700; letter-spacing: -0.01em; }}
    .auto-refresh {{ color: var(--text-secondary); font-size: 0.75rem; white-space: nowrap; }}

    /* Summary pane: dense multi-stat strip */
    .summary {{ background: var(--card-bg); border-radius: 10px; padding: 0.55rem 0.75rem; margin-bottom: 0.6rem; border: 1px solid var(--divider); display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 0.4rem 0.6rem; align-items: center; }}
    .summary-item {{ text-align: center; padding: 0.15rem 0.25rem; }}
    .summary-counts {{ display: flex; justify-content: center; align-items: baseline; gap: 0.5rem; }}
    .summary-value {{ font-size: 1.15rem; font-weight: 700; line-height: 1.15; color: var(--accent); }}
    .summary-label {{ color: var(--text-secondary); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 0.1rem; }}
    .summary-sub {{ color: var(--text-secondary); font-size: 0.68rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }}
    .online {{ color: #10b981; }}
    .offline {{ color: var(--error); }}
    .total {{ color: var(--accent); }}

    /* Compact card grid tuned for half-width (~600-950px) full-height viewports */
    .pi-grid {{ display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 0.5rem; }}
    .pi-card {{ background: var(--card-bg); border-radius: 10px; padding: 0.55rem 0.7rem; border: 1px solid var(--divider); display: flex; flex-direction: column; gap: 0.35rem; cursor: pointer; transition: border-color 0.15s; }}
    .pi-card:hover, .pi-card:focus-visible {{ border-color: var(--accent); outline: none; }}
    .pi-card-offline {{ border-color: rgba(255,59,48,0.45); }}
    .pi-header {{ display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.3rem; border-bottom: 1px solid var(--divider); gap: 0.35rem; }}
    .pi-title-group {{ display: flex; align-items: center; gap: 0.35rem; min-width: 0; flex-wrap: wrap; }}
    .pi-hostname {{ font-size: 0.92rem; font-weight: 700; color: var(--text); white-space: nowrap; }}
    .net-badge {{ font-size: 0.62rem; font-weight: 600; padding: 0.08rem 0.35rem; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.02em; }}
    .net-tailnet {{ background: rgba(0,122,255,0.18); color: var(--accent); }}
    .net-vcn {{ background: rgba(255,149,0,0.18); color: var(--warning); }}
    .pi-status {{ font-size: 0.68rem; font-weight: 600; padding: 0.12rem 0.45rem; border-radius: 8px; white-space: nowrap; }}
    .status-online {{ background: rgba(16,185,129,0.16); color: #10b981; }}
    .status-offline {{ background: rgba(255,59,48,0.18); color: var(--error); }}

    /* Compact metrics bar */
    .metrics {{ display: flex; gap: 0.4rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--divider); }}
    .metric {{ flex: 1; text-align: center; min-width: 0; }}
    .metric-value {{ font-size: 0.82rem; font-weight: 700; color: var(--accent); white-space: nowrap; line-height: 1.15; }}
    .metric-sub {{ font-size: 0.66rem; font-weight: 500; color: var(--text-secondary); }}
    .metric-bar {{ height: 3px; background: var(--divider); border-radius: 2px; margin: 0.18rem 0 0.12rem; overflow: hidden; }}
    .metric-fill {{ height: 100%; background: var(--accent); border-radius: 2px; }}
    .metric-warn {{ color: var(--warning); }}
    .metric-fill.metric-warn {{ background: var(--warning); }}
    .metric-crit {{ color: var(--error); }}
    .metric-fill.metric-crit {{ background: var(--error); }}
    .metric-label {{ font-size: 0.6rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }}

    /* Compact 2-column inline key-value metadata */
    .pi-info {{ display: grid; grid-template-columns: 1fr 1fr; gap: 0.12rem 0.55rem; }}
    .info-item {{ display: flex; justify-content: space-between; align-items: baseline; gap: 0.3rem; font-size: 0.72rem; min-width: 0; line-height: 1.25; }}
    .info-span-row {{ grid-column: 1 / -1; }}
    .info-label {{ color: var(--text-secondary); font-weight: 500; font-size: 0.68rem; flex-shrink: 0; }}
    .info-value {{ color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }}

    .boot-progress {{ padding: 0.35rem 0.5rem; background: rgba(255,149,0,0.15); border-left: 3px solid var(--warning); border-radius: 4px; font-size: 0.72rem; color: var(--text); }}
    .error-box {{ padding: 0.35rem 0.5rem; background: rgba(255,59,48,0.15); border-left: 3px solid var(--error); border-radius: 4px; font-size: 0.72rem; color: var(--error); }}
    .empty-state {{ background: var(--card-bg); border-radius: 10px; padding: 2rem; text-align: center; border: 1px solid var(--divider); }}
    .empty-state h2 {{ color: var(--text-secondary); }}

    /* Click-to-expand detail modal */
    .pi-modal-backdrop {{ display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }}
    .pi-modal-backdrop.open {{ display: flex; }}
    .pi-modal-card {{ background: var(--card-bg); border: 1px solid var(--accent); border-radius: 12px; padding: 1.1rem 1.25rem; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }}
    .detail-header {{ display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.6rem; border-bottom: 1px solid var(--divider); gap: 0.5rem; }}
    .detail-hostname {{ font-size: 1.25rem; font-weight: 700; color: var(--text); }}
    .detail-close {{ background: transparent; border: 1px solid var(--divider); color: var(--text-secondary); border-radius: 8px; width: 2rem; height: 2rem; font-size: 1.25rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }}
    .detail-close:hover {{ color: var(--text); border-color: var(--text-secondary); }}
    .detail-desc {{ font-size: 0.85rem; color: var(--text-secondary); line-height: 1.4; }}
    .detail-metrics {{ display: flex; gap: 0.75rem; padding: 0.6rem 0.75rem; background: rgba(255,255,255,0.03); border: 1px solid var(--divider); border-radius: 10px; }}
    .detail-metrics .metric-value {{ font-size: 0.95rem; white-space: normal; }}
    .detail-grid {{ display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem 1rem; }}
    .detail-item {{ display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }}
    .detail-span {{ grid-column: 1 / -1; }}
    .detail-label {{ color: var(--text-secondary); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 500; }}
    .detail-value {{ color: var(--text); font-size: 0.88rem; font-weight: 600; white-space: normal; word-break: break-word; line-height: 1.35; }}

    @media (max-width: 440px) {{ .pi-grid {{ grid-template-columns: 1fr; }} .detail-grid {{ grid-template-columns: 1fr; }} }}
</style>
{theme_css_js}
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="home-link"><a href="contents">&larr; Home</a></div>
        <h1>Pi Fleet Status</h1>
        <div class="auto-refresh"><span id="countdown">30s</span></div>
    </div>

    <div class="summary">
        <div class="summary-item">
            <div class="summary-counts">
                <span class="summary-value online">{online_count}</span>
                <span class="summary-sub">/</span>
                <span class="summary-value offline">{offline_count}</span>
                <span class="summary-sub">/</span>
                <span class="summary-value total">{total_count}</span>
            </div>
            <div class="summary-label">Up / Down / Total</div>
            <div class="summary-sub">{topology_sub}</div>
        </div>
        <div class="summary-item">
            <div class="summary-value">{avg_cpu}</div>
            <div class="summary-label">Avg CPU</div>
            <div class="summary-sub">{cpu_sub}</div>
        </div>
        <div class="summary-item">
            <div class="summary-value">{mem_summary}</div>
            <div class="summary-label">Fleet RAM</div>
            <div class="summary-sub">{mem_sub}</div>
        </div>
        <div class="summary-item">
            <div class="summary-value">{disk_summary}</div>
            <div class="summary-label">Fleet Disk</div>
            <div class="summary-sub">{disk_sub}</div>
        </div>
        <div class="summary-item">
            <div class="summary-value">{uptime_summary}</div>
            <div class="summary-label">Min Uptime</div>
            <div class="summary-sub">{uptime_sub}</div>
        </div>
    </div>

    {cards_html}
</div>

<div id="pi-modal" class="pi-modal-backdrop" onclick="if(event.target===this)closePiModal()">
    <div id="pi-modal-content" class="pi-modal-card" role="dialog" aria-modal="true"></div>
</div>

<script>
    let secondsLeft = 30;
    const countdownEl = document.getElementById('countdown');
    const modalEl = document.getElementById('pi-modal');
    const modalContentEl = document.getElementById('pi-modal-content');

    function openPiModal(cardEl) {{
        const tpl = cardEl.querySelector('.pi-detail-tpl');
        if (!tpl) return;
        modalContentEl.innerHTML = tpl.innerHTML;
        modalEl.classList.add('open');
        const host = cardEl.getAttribute('data-hostname');
        if (host) {{
            try {{ sessionStorage.setItem('piFleetOpenHost', host); }} catch (e) {{}}
        }}
    }}

    function closePiModal() {{
        modalEl.classList.remove('open');
        modalContentEl.innerHTML = '';
        try {{ sessionStorage.removeItem('piFleetOpenHost'); }} catch (e) {{}}
    }}

    document.addEventListener('keydown', function(e) {{
        if (e.key === 'Escape' && modalEl.classList.contains('open')) {{
            closePiModal();
        }}
    }});

    // Restore open modal across auto-refresh
    try {{
        const savedHost = sessionStorage.getItem('piFleetOpenHost');
        if (savedHost) {{
            const card = document.querySelector(`.pi-card[data-hostname="${{CSS.escape(savedHost)}}"]`);
            if (card) openPiModal(card);
        }}
    }} catch (e) {{}}

    function updateCountdown() {{
        countdownEl.textContent = `refresh in ${{secondsLeft}}s`;
        secondsLeft--;

        if (secondsLeft < 0) {{
            location.reload();
        }}
    }}

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
</body>
</html>
